syntax = "proto3";

package kwaque.common.v1;

import "proto/kwaque/common/v1/identity.proto";

// Stable wire values, independent of internal error-category ordinals.
// Retired enum numbers and names must be reserved permanently and never reused.
enum ErrorCode {
    ERROR_CODE_UNSPECIFIED = 0;
    ERROR_CODE_INVALID_REQUEST = 1;
    ERROR_CODE_UNSUPPORTED = 2;
    ERROR_CODE_STALE_ROUTING = 3;
    ERROR_CODE_STALE_SEGMENT = 4;
    ERROR_CODE_UNAVAILABLE = 5;
    ERROR_CODE_RESOURCE_LIMIT = 6;
    ERROR_CODE_TIMED_OUT = 7;
    ERROR_CODE_ABORTED = 8;
    ERROR_CODE_NOT_LEADER = 9;
}

// A failure response. Success is not represented by an Error message.
// Retired field numbers and names must be reserved permanently and never
// reused.
message Error {
    // Required. UNSPECIFIED is invalid; unrecognized values are unsupported.
    optional ErrorCode code = 1;

    // Optional UTF-8 explanation, at most 1024 bytes. Present-empty is distinct
    // from absent. Do not populate this from arbitrary exception/internal text.
    optional string reason = 2;

    // Required for stale-routing/stale-segment codes; otherwise optional.
    RoutingContext observed = 3;
}
