name: Set up build environment
description: Install the pinned Bazel driver and restore the shared download caches

runs:
  using: composite
  steps:
    - name: Install archive support
      shell: bash
      run: |
        if ! command -v zstd >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install --yes zstd
        fi
    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-cache: true
        # Build outputs are not cached here: per-configuration snapshots
        # exceed the repository's cache budget and evict each other. Downloads
        # are cached, and only runs on main write them; pull requests and
        # merge queue runs restore what main saved.
        disk-cache: false
        repository-cache: true
        cache-save: ${{ github.ref == 'refs/heads/main' }}
