name: Set up build environment
description: Install the pinned Bazel driver and enable shared download caches

runs:
  using: composite
  steps:
    - name: Install archive support
      shell: bash
      run: |
        if ! command -v zstd >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install --yes zstd
        fi
    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}
        repository-cache: true
        cache-save: >-
          ${{ github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository }}
