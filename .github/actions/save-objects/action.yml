name: Save compiled objects
description: Keep exactly the compiled objects this run stored or read, under this commit

inputs:
  objects:
    description: The configuration whose objects setup-build restored.
    required: true

runs:
  using: composite
  steps:
    - name: Drop objects this run did not use
      shell: bash
      run: |
        # Bazel sets an entry's mtime whenever it stores or reads it, and an
        # action result's before the blobs it names, so this leaves no result
        # that names a missing blob.
        find "${HOME}/.cache/bazel-objects" -type f ! -newer "${RUNNER_TEMP}/bazel-objects.started" -delete
        find "${HOME}/.cache/bazel-objects" -mindepth 1 -type d -empty -delete
        du -sh "${HOME}/.cache/bazel-objects"
    - name: Save compiled objects
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/bazel-objects
        key: bazel-objects-${{ inputs.objects }}-${{ github.sha }}
