name: Scheduled reactor backends

on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  io-uring:
    name: Unit and smoke tests on io_uring
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Run unit and smoke tests
        id: tests
        run: >-
          bazel test --config=ci-debug
          --//bazel:reactor_backend=io_uring
          --build_tag_filters=-fuzz,-manual
          --test_tag_filters=-fuzz,-manual
          //...
      - name: Retain failed test diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        uses: ./.github/actions/retain-logs
        with:
          name: ci-${{ github.job }}-${{ runner.arch }}-${{ github.run_attempt }}
