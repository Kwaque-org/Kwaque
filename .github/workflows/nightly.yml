name: Scheduled stress and coverage

on:
  schedule:
    - cron: '11 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stress:
    name: Repeated smoke and lifecycle tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Allow concurrent linux-aio reactors
        run: sudo sysctl -w fs.aio-max-nr=1048576
      - name: Repeat every smoke and stress-tagged test
        id: tests
        # A flaky failure appears as one failed run among twenty. Shuffled
        # GoogleTest order prints its seed for replay with GTEST_RANDOM_SEED.
        run: >-
          bazel test --config=ci-debug
          --//bazel:reactor_backend=linux-aio
          --runs_per_test=20 --cache_test_results=no
          --test_env=GTEST_SHUFFLE=1
          --build_tag_filters=smoke,stress
          --test_tag_filters=smoke,stress,-manual
          //...
      - name: Retain failed test diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        uses: ./.github/actions/retain-logs
        with:
          name: nightly-${{ github.job }}-${{ github.run_attempt }}

  coverage:
    name: LLVM line coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Allow concurrent linux-aio reactors
        run: sudo sysctl -w fs.aio-max-nr=1048576
      - name: Measure first-party coverage
        id: tests
        run: >-
          bazel coverage --config=ci-debug
          --//bazel:reactor_backend=linux-aio
          --build_tag_filters=-fuzz,-manual,-benchmark
          --test_tag_filters=-fuzz,-manual,-benchmark
          //...
      - name: Upload the combined report
        if: steps.tests.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.run_attempt }}
          path: bazel-out/_coverage/_coverage_report.dat
          retention-days: 30
          if-no-files-found: error
      - name: Retain failed test diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        uses: ./.github/actions/retain-logs
        with:
          name: nightly-${{ github.job }}-${{ github.run_attempt }}

  # Two cold release builds that share nothing but the source revision: separate
  # runners, output bases and checkout paths. The compare job requires
  # byte-identical archives.
  reproducible-package-a:
    name: Release package, first build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Build the release package
        run: >-
          bazel --output_base="${RUNNER_TEMP}/first-output" build --config=ci-release
          //bazel/packaging:kwaque_tar //bazel/packaging:kwaque_tar_sha256
      - name: Keep the archive for comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducible-package-first-${{ github.run_attempt }}
          path: |
            bazel-bin/bazel/packaging/*.tar.gz
            bazel-bin/bazel/packaging/*.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

  reproducible-package-b:
    name: Release package, second build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source at another path
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: relocated/kwaque
      - uses: ./relocated/kwaque/.github/actions/setup-build
      - name: Build the release package
        working-directory: relocated/kwaque
        run: >-
          bazel --output_base="${RUNNER_TEMP}/second-output" build --config=ci-release
          //bazel/packaging:kwaque_tar //bazel/packaging:kwaque_tar_sha256
      - name: Keep the archive for comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducible-package-second-${{ github.run_attempt }}
          path: |
            relocated/kwaque/bazel-bin/bazel/packaging/*.tar.gz
            relocated/kwaque/bazel-bin/bazel/packaging/*.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

  reproducible-package:
    name: Reproducible release package
    needs: [reproducible-package-a, reproducible-package-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download both builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: reproducible-package-*-${{ github.run_attempt }}
          path: builds
      - name: Compare the archives byte for byte
        run: |
          set -euo pipefail
          first=(builds/reproducible-package-first-*/*.tar.gz)
          second=(builds/reproducible-package-second-*/*.tar.gz)
          [[ ${#first[@]} -eq 1 && ${#second[@]} -eq 1 ]]
          sha256sum "${first[0]}" "${second[0]}"
          if cmp -s "${first[0]}" "${second[0]}"; then
            exit 0
          fi
          # Name the files that differ so the cause can be found.
          mkdir first second
          tar -xzf "${first[0]}" -C first
          tar -xzf "${second[0]}" -C second
          (cd first && find . -type f -exec sha256sum {} + | sort -k2) > first.sums
          (cd second && find . -type f -exec sha256sum {} + | sort -k2) > second.sums
          diff first.sums second.sums || true
          echo "two builds of the same revision produced different archives" >&2
          exit 1
