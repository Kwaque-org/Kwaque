name: Scheduled fuzzing

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  campaign-targets:
    name: Select campaign targets
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    outputs:
      targets: ${{ steps.query.outputs.targets }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Query targets tagged for scheduled campaigns
        id: query
        # The tag is the campaign membership; no list is maintained here.
        run: |
          set -o pipefail
          targets="$(bazel query --output=label \
            'attr(tags, "\bfuzz-campaign\b", tests(//...))' |
            python3 -c 'import json, sys; print(json.dumps(sys.stdin.read().split()))')"
          if [[ "${targets}" == "[]" ]]; then
            echo "no fuzz-campaign targets were found" >&2
            exit 1
          fi
          echo "targets=${targets}" >> "${GITHUB_OUTPUT}"

  fuzz-campaign:
    name: ASan and UBSan (${{ matrix.target }})
    needs: campaign-targets
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJSON(needs.campaign-targets.outputs.targets) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Name the target's corpus
        id: corpus
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          echo "key=fuzz-corpus-$(printf '%s' "${FUZZ_TARGET}" | tr -c 'A-Za-z0-9_-' '_')" >> "${GITHUB_OUTPUT}"
          echo "directory=${RUNNER_TEMP}/fuzz-corpus" >> "${GITHUB_OUTPUT}"
      # The commit seeds the campaign: libFuzzer takes a nonzero 32-bit seed,
      # here the commit's first eight hexadecimal digits, and its log prints
      # it beside the target and the corpus it continued from. A campaign on
      # a grown corpus and a time bound is replayed from its retained input;
      # the seed and the commit say which campaign that was.
      - name: Seed the campaign from the commit
        id: seed
        run: |
          seed=$((16#${GITHUB_SHA:0:8}))
          if [ "${seed}" -eq 0 ]; then seed=1; fi
          echo "value=${seed}" >> "${GITHUB_OUTPUT}"
          echo "campaign seed ${seed} at ${GITHUB_SHA}"
      # Each campaign starts from the checked-in seeds and a sample of the
      # corpus the previous ones kept; the wrapper then merges what it found
      # into that corpus, which keeps only the inputs that add coverage.
      - name: Restore the corpus from earlier campaigns
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.directory }}
          key: ${{ steps.corpus.outputs.key }}-${{ github.run_id }}
          restore-keys: ${{ steps.corpus.outputs.key }}-
      # A target's first campaign has no corpus to restore, and the sandbox
      # refuses every action when a writable path does not exist.
      - name: Make sure the corpus directory exists
        env:
          CORPUS: ${{ steps.corpus.outputs.directory }}
        run: mkdir -p "${CORPUS}"
      # The campaign's 600 s, which its first inputs run inside, a round of
      # mutations past it, the merge's 1800 s and a reduction's 50 s. A
      # campaign that never hits a required coverage mark fails.
      - name: Run a bounded fuzz campaign
        id: tests
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          CORPUS: ${{ steps.corpus.outputs.directory }}
          CAMPAIGN_SEED: ${{ steps.seed.outputs.value }}
        run: >-
          bazel test --config=ci --config=fuzz
          --test_output=all --test_timeout=2520
          --test_env=KWAQUE_FUZZ_MINIMIZE_SECONDS=30
          --test_env=KWAQUE_FUZZ_MARKS_GATE=1
          --test_env=KWAQUE_FUZZ_CORPUS_DIR="${CORPUS}"
          --sandbox_writable_path="${CORPUS}"
          --test_arg=-max_total_time=600
          --test_arg=-timeout=15
          --test_arg=-seed="${CAMPAIGN_SEED}"
          "${FUZZ_TARGET}"
      - name: Keep the grown corpus
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.directory }}
          key: ${{ steps.corpus.outputs.key }}-${{ github.run_id }}
      - name: Retain failed test diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        uses: ./.github/actions/retain-logs
        with:
          name: fuzz-${{ strategy.job-index }}-${{ github.run_attempt }}
