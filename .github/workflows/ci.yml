name: CI

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A newer push replaces a pull request run, but never a run on main: every
  # main commit keeps a complete result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  workflow-lint:
    name: Workflow syntax
    # A pull request opened by Dependabot waits for a maintainer: the first
    # attempt of its run checks nothing, and "Re-run all jobs" on that run
    # starts every check. Every other job needs this one.
    if: github.event.pull_request.user.login != 'dependabot[bot]' || github.run_attempt != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run_checks: ${{ steps.changes.outputs.run_checks }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks from the complete change range
        id: changes
        run: python3 tools/ci_changes.py
      - name: Check CI selection and coverage
        run: python3 -m unittest tools.ci_changes_test tools.check_ci_coverage_test
      - name: Run actionlint
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          --workdir /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  build:
    name: Release build and shipped-artifact tests
    needs: workflow-lint
    if: needs.workflow-lint.outputs.run_checks != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Allow concurrent linux-aio reactors
        run: sudo sysctl -w fs.aio-max-nr=1048576
      - name: Build all ordinary targets
        run: >-
          bazel build --config=ci-release
          --build_tag_filters=-fuzz,-manual
          //...

      - name: Verify optimized runtime, process policy and determinism goldens
        id: tests
        run: >-
          bazel test --config=ci-release
          --cache_test_results=no
          //bazel/tests:seastar_gtest
          //src/runtime/tests:reactor_smoke_test
          //src/runtime/tests:runtime_metrics_test
          //src/broker:failure_policy_test
          //src/broker:crash_recorder_process_test
          //src/simulation/tests:determinism_goldens
          //src/storage/tests:format_tests
          //src/model/tests:checkpoint_tests
          //src/model/tests:format_fixture_test
          //src/model/tests:batch_builder_test
          //src/protocol/tests:golden_tests
          //src/compression/tests:format_fixture_test
          //tools:verify_format_fixtures_test

      - name: Test the shipped package, broker processes and fuzz replays
        id: shipped
        run: >-
          bazel test --config=ci-release
          --//bazel:reactor_backend=linux-aio
          --build_tag_filters=-fuzz,-manual
          --test_tag_filters=package,smoke,fuzz_replay
          //...

      - name: Retain failed test diagnostics
        if: failure() && (steps.tests.outcome == 'failure' || steps.shipped.outcome == 'failure')
        uses: ./.github/actions/retain-logs
        with:
          name: ci-${{ github.job }}-${{ runner.arch }}-${{ github.run_attempt }}

  native-policy:
    name: Native policy without allocation injection
    needs: workflow-lint
    if: needs.workflow-lint.outputs.run_checks != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Verify native runtime and process policy
        id: tests
        run: >-
          bazel test --config=ci-native
          //bazel/tests:seastar_gtest
          //src/runtime/tests:reactor_smoke_test
          //src/runtime/tests:runtime_metrics_test
          //src/broker:failure_policy_test
          //src/broker:crash_recorder_process_test

      - name: Retain failed test diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        uses: ./.github/actions/retain-logs
        with:
          name: ci-${{ github.job }}-${{ runner.arch }}-${{ github.run_attempt }}

  test:
    name: Native allocation injection, unit and smoke tests
    needs: workflow-lint
    if: needs.workflow-lint.outputs.run_checks != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Allow concurrent linux-aio reactors
        run: sudo sysctl -w fs.aio-max-nr=1048576
      - name: Run unit and smoke tests
        id: unit_tests
        run: >-
          bazel test --config=ci-debug
          --//bazel:reactor_backend=linux-aio
          --build_tag_filters=-fuzz,-manual
          --test_tag_filters=-fuzz,-manual
          //...

      - name: Repeat the real adapter and environment contracts in sandboxes
        id: hermetic_tests
        run: >-
          bazel test --config=ci-debug --spawn_strategy=sandboxed
          --//bazel:reactor_backend=linux-aio
          --runs_per_test=10 --cache_test_results=no
          //src/runtime/tests:hermetic_contracts

      - name: Retain failed test diagnostics
        if: failure() && (steps.unit_tests.outcome == 'failure' || steps.hermetic_tests.outcome == 'failure')
        uses: ./.github/actions/retain-logs
        with:
          name: ci-${{ github.job }}-${{ runner.arch }}-${{ github.run_attempt }}

  sanitizer:
    name: ASan and UBSan
    needs: workflow-lint
    if: needs.workflow-lint.outputs.run_checks != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Execute tests with sanitizers
        id: tests
        run: >-
          bazel test --config=ci-sanitizer
          --build_tag_filters=-fuzz,-manual
          --test_tag_filters=-fuzz,-manual
          //...

      - name: Retain failed test diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        uses: ./.github/actions/retain-logs
        with:
          name: ci-${{ github.job }}-${{ runner.arch }}-${{ github.run_attempt }}

  goldens:
    # The other runner and build combinations execute the same suite inside
    # the test, build and arm-build jobs.
    name: Determinism goldens (aarch64, debug)
    needs: workflow-lint
    if: needs.workflow-lint.outputs.run_checks != 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Execute the canonical golden suite
        id: tests
        run: >-
          bazel test --config=ci-debug
          --cache_test_results=no
          //src/simulation/tests:determinism_goldens
          //src/storage/tests:format_tests
          //src/model/tests:checkpoint_tests
          //src/model/tests:format_fixture_test
          //src/model/tests:batch_builder_test
          //src/protocol/tests:golden_tests
          //src/compression/tests:format_fixture_test
          //tools:verify_format_fixtures_test

      - name: Retain failed test diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        uses: ./.github/actions/retain-logs
        with:
          name: ci-${{ github.job }}-${{ runner.arch }}-${{ github.run_attempt }}

  cpp-format:
    name: C++ and Bazel formatting
    needs: workflow-lint
    if: needs.workflow-lint.outputs.run_checks != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Check C++ formatting
        run: bazel run --lockfile_mode=error //tools:format_cpp_all -- --check
      - name: Check Bazel formatting and lint
        run: bazel run --lockfile_mode=error //tools:buildifier_check

  python-lint:
    name: Python formatting and lint
    needs: workflow-lint
    if: needs.workflow-lint.outputs.run_checks != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Python formatting
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: format --check --diff
          version: 0.16.9
          checksum: 1bfbb819b5d4f9af501748862276b60e412d336034d99387691a4d4bce7a6f13
      - name: Lint Python
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check --output-format=github
          version: 0.16.9
          checksum: 1bfbb819b5d4f9af501748862276b60e412d336034d99387691a4d4bce7a6f13

  clang-tidy:
    name: Clang tidy
    needs: workflow-lint
    if: needs.workflow-lint.outputs.run_checks != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Materialize generated analysis inputs
        run: >-
          bazel build --config=ci-debug
          --remote_download_outputs=all
          --aspects=//bazel:analysis_inputs.bzl%analysis_inputs
          --output_groups=clang_tidy_inputs
          --build_tag_filters=-fuzz,-manual //...
      - name: Generate compilation database
        run: >-
          bazel run --config=ci-debug --lockfile_mode=error //tools:compile_commands --
          --config=ci-debug
      - name: Run baseline and strict production checks without overlap
        run: >-
          bazel run --config=ci-debug --lockfile_mode=error //tools:clang_tidy -- --jobs=2
          --production-config=.clang-tidy-strict

  clang-tidy-fuzz:
    name: Clang tidy for fuzz sources
    needs: workflow-lint
    if: needs.workflow-lint.outputs.run_checks != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Materialize fuzz analysis inputs
        run: >-
          bazel build --config=ci --config=fuzz
          --remote_download_outputs=all
          --aspects=//bazel:analysis_inputs.bzl%analysis_inputs
          --output_groups=clang_tidy_inputs
          --build_tag_filters=fuzz //...
      - name: Generate the fuzz compilation database
        run: >-
          bazel run --config=ci --config=fuzz --lockfile_mode=error //tools:compile_commands --
          --fuzz-only --config=ci --config=fuzz
      - name: Check fuzz translation units and their dependencies
        run: bazel run --config=ci --config=fuzz --lockfile_mode=error //tools:clang_tidy -- --jobs=2

  repository-checks:
    name: Repository integrity
    needs: workflow-lint
    if: needs.workflow-lint.outputs.run_checks != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Check generated artifacts
        run: bazel run --lockfile_mode=error //tools:check_generated_artifacts
      - name: Check dependency inventory
        run: bazel run --lockfile_mode=error //tools:check_dependency_inventory
      - name: Check packaged licenses against the linked dependencies
        run: bazel run --lockfile_mode=error //tools:check_package_licenses
      - name: Check package dependency graph
        run: bazel run --lockfile_mode=error //tools:check_bazel_package_cycles
      - name: Check cross-shard ownership
        run: bazel run --lockfile_mode=error //tools:check_cross_shard_usage
      - name: Check runtime dependency boundaries
        run: bazel run --lockfile_mode=error //tools:check_runtime_boundaries
      - name: Check deterministic source boundaries
        run: bazel run --lockfile_mode=error //tools:check_determinism
      - name: Check module files and lock
        # Tidy rewrites use_repo lists and formatting; the lock must then match
        # every module and extension. Either change means a stale commit.
        run: |
          bazel mod tidy --lockfile_mode=update
          bazel mod deps --lockfile_mode=update
          git diff --exit-code -- MODULE.bazel MODULE.bazel.lock

  fuzz-smoke:
    name: ASan and UBSan fuzz smoke
    needs: workflow-lint
    if: needs.workflow-lint.outputs.run_checks != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Run every fixed-corpus fuzz smoke and the signal artifact canary
        id: tests
        # Tags select the targets, so a new fuzz test cannot be left out.
        run: >-
          bazel test --config=ci --config=fuzz
          --keep_going --test_output=all --test_arg=-seed=1
          --test_env=KWAQUE_FUZZ_MINIMIZE_SECONDS=30
          --test_arg=-max_total_time=2
          --build_tag_filters=fuzz
          --test_tag_filters=fuzz,-manual
          //...

      - name: Retain failed test diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        uses: ./.github/actions/retain-logs
        with:
          name: fuzz-smoke-${{ github.run_attempt }}

  arm-build:
    name: Linux aarch64 release build and tests
    needs: workflow-lint
    if: needs.workflow-lint.outputs.run_checks != 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Allow concurrent linux-aio reactors
        run: sudo sysctl -w fs.aio-max-nr=1048576
      - name: Build all ordinary targets
        run: >-
          bazel build --config=ci-release
          --build_tag_filters=-fuzz,-manual
          //...
      - name: Test deterministic runtime and goldens on aarch64 release
        id: tests
        run: >-
          bazel test --config=ci-release
          --cache_test_results=no
          //src/simulation/tests:determinism_goldens
          //src/compression/tests:format_fixture_test
          //tools:verify_format_fixtures_test
          //src/compression/tests:format_tests
          //src/storage/tests:format_tests
          //src/model/tests:checkpoint_tests
          //src/model/tests:format_fixture_test
          //src/model/tests:batch_builder_test
          //src/protocol/tests:golden_tests
          //src/model/tests:batch_compression_test
          //bazel/tests:seastar_gtest
          //src/runtime/tests:reactor_smoke_test
          //src/runtime/tests:runtime_metrics_test
          //src/broker:launcher_test
          //src/broker:startup_policy_test
          //src/broker:startup_configuration_test
          //src/broker:failure_policy_test
          //src/broker:config_cli_test
          //src/broker:host_checks_test
          //src/broker:broker_headroom_test
          //src/broker:application_shutdown_test
          //src/broker:shutdown_watchdog_test
          //src/broker:crash_limiter_test
          //src/broker:crash_recorder_writer_test
          //src/broker:crash_recorder_test
          //src/broker:crash_recorder_process_test
          //src/resource/tests:resource_headroom_test
          //src/admin:admin_resource_test
          //src/admin:admin_memory_test
          //src/resource/tests:queue_worker_failure_test
          //src/observability:event_codec_invariant_test
          //src/runtime/tests:operation_error_test
          //src/simulation/tests:scheduler_test
          //src/simulation/tests:virtual_time_test
          //src/simulation/tests:virtual_time_binding_test
          //src/simulation/tests:virtual_time_death_test
          //src/simulation/tests:timer_test
          //src/simulation/tests:philox_kat_test
          //src/simulation/tests:deterministic_random_test
          //src/simulation/tests:event_trace_test
          //src/simulation/tests:determinism_test
          //src/simulation/tests:fault_schedule_test
          //src/simulation/tests:fake_file_test
          //src/simulation/tests:fake_file_runtime_test
          //src/simulation/tests:fake_file_replay_test

      - name: Test the shipped package, broker processes and fuzz replays
        id: shipped
        run: >-
          bazel test --config=ci-release
          --//bazel:reactor_backend=linux-aio
          --build_tag_filters=-fuzz,-manual
          --test_tag_filters=package,smoke,fuzz_replay
          //...

      - name: Retain failed test diagnostics
        if: failure() && (steps.tests.outcome == 'failure' || steps.shipped.outcome == 'failure')
        uses: ./.github/actions/retain-logs
        with:
          name: ci-${{ github.job }}-${{ runner.arch }}-${{ github.run_attempt }}

  ci-ok:
    # The one required status check. GitHub counts a skipped required job as
    # passing, so a failure that skips its dependents must fail here instead:
    # https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches#require-status-checks-before-merging
    # A held Dependabot run skips every other job, and fails here the same way.
    name: CI result
    if: always()
    needs:
      - workflow-lint
      - build
      - native-policy
      - test
      - sanitizer
      - goldens
      - cpp-format
      - python-lint
      - clang-tidy
      - clang-tidy-fuzz
      - repository-checks
      - fuzz-smoke
      - arm-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: ${{ needs.workflow-lint.result == 'skipped' }}
        run: echo "::error::Checks on a Dependabot pull request wait for a maintainer; choose 'Re-run all jobs' on this run to start them."
      - if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.workflow-lint.result != 'success') }}
        run: exit 0
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.workflow-lint.result != 'success' }}
        run: exit 1
