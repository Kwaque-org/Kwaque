version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    # A new release waits a week before it is proposed, so a compromised or
    # withdrawn release is usually caught upstream first.
    cooldown:
      default-days: 7
  - package-ecosystem: bazel
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
