# Development example for running one local Kwaque broker from the source
# tree. Production deployments start from kwaque.production.yaml instead.
kwaque:
  schema_version: 1
  # Relative paths resolve against the directory the broker starts in.
  data_directory: "./data"
  admin:
    address: "127.0.0.1"
    port: 9644
  developer_mode: true
  # Cooperative workload budget for system-allocator diagnostic builds.
  # Native-allocator builds use their observed shard capacity instead.
  diagnostic_memory_per_shard_bytes: 134217728
  # When enabled, .kwaque_data_dir must already exist in data_directory.
  storage_strict_data_init: false
